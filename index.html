<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#e8612a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="FIRST갤러리"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>FIRST 제품 갤러리</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:#f8f8f8;}
    #root{min-height:100vh;}
    .spinner{display:inline-block;width:28px;height:28px;border:3px solid #f0d0c0;border-top-color:#e8612a;border-radius:50%;animation:spin 0.8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    #install-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;
      background:#1a1a1a;color:#fff;padding:14px 20px;
      flex-direction:row;align-items:center;gap:12px;box-shadow:0 -2px 12px rgba(0,0,0,0.3);}
    #install-banner.show{display:flex;}
    #install-banner img{width:36px;height:36px;object-fit:contain;background:#fff;border-radius:8px;padding:4px;}
    #install-banner .txt{flex:1;}
    #install-banner .txt strong{display:block;font-size:13px;margin-bottom:2px;}
    #install-banner .txt span{font-size:11px;color:#aaa;}
    #install-banner .ok{background:#e8612a;color:#fff;border:none;padding:8px 16px;font-size:13px;font-weight:700;border-radius:4px;cursor:pointer;}
    #install-banner .no{background:none;color:#888;border:none;padding:8px;font-size:20px;cursor:pointer;}
    .blog-output{white-space:pre-wrap;line-height:1.8;font-size:14px;color:#2d2d2d;}
  </style>
</head>
<body>
<div id="root"></div>
<div id="install-banner">
  <img src="icon-192.png" alt="아이콘"/>
  <div class="txt">
    <strong>홈 화면에 추가하기</strong>
    <span>앱처럼 바로 열 수 있어요</span>
  </div>
  <button class="ok" id="install-btn">설치</button>
  <button class="no" id="install-close">✕</button>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBfahEzsyZLB7GbD7Gf-u7jhtZ1PH7tgXU",
  authDomain: "first-gallery-d7751.firebaseapp.com",
  projectId: "first-gallery-d7751",
  storageBucket: "first-gallery-d7751.firebasestorage.app",
  messagingSenderId: "1038518171709",
  appId: "1:1038518171709:web:6cf9105584d4820aed9254"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let deferredPrompt;
const banner = document.getElementById('install-banner');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;banner.classList.add('show');});
document.getElementById('install-btn').addEventListener('click',()=>{banner.classList.remove('show');if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}});
document.getElementById('install-close').addEventListener('click',()=>banner.classList.remove('show'));
window.addEventListener('appinstalled',()=>banner.classList.remove('show'));
</script>

function compressImage(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onerror=rej;
    reader.onload=(e)=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        let {width,height}=img;
        const scale=Math.min(1,COMPRESS_PX/Math.max(width,height));
        width=Math.round(width*scale); height=Math.round(height*scale);
        const canvas=document.createElement("canvas");
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        const data=canvas.toDataURL("image/jpeg",COMPRESS_Q);
        const bytes=Math.round((data.length*3)/4);
        res({data,width,height,bytes});
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function fmtBytes(b){return b<1048576?(b/1024).toFixed(0)+"KB":(b/1048576).toFixed(1)+"MB";}
function downloadBlob(blob,fn){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fn;a.click();URL.revokeObjectURL(url);}
async function dlZip(imgs,label){
  const zip=new JSZip(); const folder=zip.folder(label);
  imgs.forEach((img,i)=>folder.file(String(i+1).padStart(3,"0")+"_"+img.name,img.data.split(",")[1],{base64:true}));
  downloadBlob(await zip.generateAsync({type:"blob"}),label+".zip");
}

    try{const v=localStorage.getItem(TEACHER_KEY);if(v){const p=JSON.parse(v);if(p?.length)setTeachers(p);}}catch{}
  },[]);
  const saveTeachers=(list)=>{try{localStorage.setItem(TEACHER_KEY,JSON.stringify(list));}catch{}};

  useEffect(()=>{
    const unsub=db.collection("images").orderBy("uploadedTs","desc").onSnapshot((snap)=>{
      setImages(snap.docs.map(d=>({id:d.id,...d.data()})));
      setLoading(false);
    },(err)=>{console.error(err);setLoading(false);});
    return ()=>unsub();
  },[]);

  const handleFiles=useCallback(async(files)=>{
    setUploadError(""); setUploadResult(null); setUploading(true); setUploadProgress(0);
    const arr=Array.from(files).filter(f=>f.type.startsWith("image/"));
    let done=0,origTotal=0,compTotal=0;
    for(const file of arr){
      if(file.size>MAX_MB*1024*1024){setUploadError(MAX_MB+"MB 이하만 가능합니다.");continue;}
      origTotal+=file.size;
      try{
        const {data,width,height,bytes}=await compressImage(file);
        if(bytes>900*1024){setUploadError("압축 후에도 너무 큰 파일이에요.");continue;}
        compTotal+=bytes;
        const now=new Date();
        await db.collection("images").add({
          name:file.name.replace(/\.[^.]+$/,".jpg"),
          data,width,height,
          teacherId:uploadingTeacher,
          uploadedAt:now.toLocaleDateString("ko-KR"),
          uploadedTs:now.getTime(),
          useStatus:"unused",
          blogNote:"",
        });
        done++;
        setUploadProgress(Math.round((done/arr.length)*100));
      }catch(e){setUploadError("업로드 실패: "+e.message);}
    }
    setUploading(false);
    if(done>0){
      const pct=Math.max(0,Math.round((1-compTotal/origTotal)*100));
      setUploadResult({count:done,before:(origTotal/1048576).toFixed(1),after:fmtBytes(compTotal),savedPct:pct});
      setTimeout(()=>setUploadResult(null),5000);
    }
  },[uploadingTeacher]);

      React.createElement("div",{style:{display:"flex",flexWrap:"wrap",marginBottom:"1.25rem",borderBottom:"2px solid "+C.line}},
        teachers.map(t=>{
          const count=t.id==="all"?images.length:images.filter(i=>i.teacherId===t.id).length;
          const active=selTeacher===t.id;
          return React.createElement("button",{key:t.id,
            onClick:()=>{setSelTeacher(t.id);setSelectedIds(new Set());setSelectionMode(false);},
            style:{fontSize:13,padding:"10px 14px",cursor:"pointer",fontWeight:active?700:400,
              background:"none",color:active?C.coral:C.gray,border:"none",
              borderBottom:active?"2px solid "+C.coral:"2px solid transparent",
              marginBottom:-2,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}},
            t.name,
            React.createElement("span",{style:{fontSize:11,background:active?C.coral:C.bg,color:active?"#fff":C.grayMid,borderRadius:10,padding:"1px 7px",fontWeight:700}},count)
          );
        })
      ),

      // 툴바
      filtered.length>0&&React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:"1.25rem",flexWrap:"wrap"}},
        React.createElement("select",{value:sortBy,onChange:e=>setSortBy(e.target.value),
          style:{fontSize:12,padding:"7px 10px",border:"1px solid "+C.line,background:C.white,outline:"none"}},
          React.createElement("option",{value:"date-desc"},"최신순"),
          React.createElement("option",{value:"date-asc"},"오래된순"),
          React.createElement("option",{value:"teacher"},"강사순"),
          React.createElement("option",{value:"status"},"사용상태순")
        ),
        React.createElement(Btn,{onClick:()=>setGroupByDate(!groupByDate),active:groupByDate},"📅 날짜별"),
        React.createElement("div",{style:{flex:1}}),
        !selectionMode
          ?React.createElement(React.Fragment,null,
            React.createElement(Btn,{onClick:()=>setSelectionMode(true)},"☑ 선택"),
            React.createElement(Btn,{onClick:dlAll,disabled:zipping,primary:true},zipping?"압축 중...":"⬇ 전체 ("+filtered.length+"장)")
          )
          :React.createElement(React.Fragment,null,
            React.createElement(Btn,{onClick:selectAll},"전체"),
            React.createElement(Btn,{onClick:clearSel},"취소"),
            selectedIds.size>0&&React.createElement(React.Fragment,null,
              React.createElement(Btn,{onClick:dlSelected,disabled:zipping,primary:true},zipping?"압축 중...":"⬇ "+selectedIds.size+"장"),
              React.createElement(Btn,{onClick:()=>setDeleteConfirm("bulk"),danger:true},"🗑 "+selectedIds.size+"장")
            )
          )
      ),

      // 일괄삭제 확인
      deleteConfirm==="bulk"&&React.createElement("div",{style:{background:"#fff1ee",border:"1px solid "+C.coral,padding:"12px 16px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between"}},
        React.createElement("span",{style:{fontSize:13,color:C.coral,fontWeight:700}},"선택한 "+selectedIds.size+"장을 삭제할까요?"),
        React.createElement("div",{style:{display:"flex",gap:8}},
          React.createElement("button",{onClick:()=>handleDelete([...selectedIds]),style:{fontSize:13,padding:"6px 16px",background:C.coral,color:"#fff",border:"none",cursor:"pointer",fontWeight:700}},"삭제"),
          React.createElement("button",{onClick:()=>setDeleteConfirm(null),style:{fontSize:13,padding:"6px 12px",background:C.bg,border:"1px solid "+C.line,cursor:"pointer"}},"취소")
        )
      ),

      // 갤러리
      filtered.length===0
        ?React.createElement("div",{style:{textAlign:"center",padding:"4rem 1rem",background:C.white,border:"1px solid "+C.line}},
          React.createElement("div",{style:{fontSize:48,marginBottom:14}},"📷"),
          React.createElement("p",{style:{fontSize:14,color:C.grayMid}},filterStatus!=="all"?stMap[filterStatus].label+" 사진이 없습니다.":"아직 업로드된 사진이 없습니다.")
        )
        :groupByDate
          ?React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:"2rem"}},
            dateKeys.map(date=>{
              const di=grouped[date], dOffset=filtered.indexOf(di[0]);
              return React.createElement("div",{key:date},
                React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:12}},
                  React.createElement("div",{style:{width:3,height:16,background:C.coral}}),
                  React.createElement("span",{style:{fontSize:14,fontWeight:700,color:C.black}},date),
                  React.createElement("span",{style:{fontSize:12,color:C.grayMid}},di.length+"장"),
                  React.createElement("div",{style:{flex:1,height:1,background:C.line}})
                ),
                React.createElement(GalleryGrid,{imgs:di,baseOffset:dOffset})
              );
            })
          )
          :React.createElement(GalleryGrid,{imgs:filtered,baseOffset:0}),

      // 통계
      images.length>0&&React.createElement("div",{style:{marginTop:"2rem",paddingTop:"1rem",borderTop:"1px solid "+C.line,display:"flex",gap:16,flexWrap:"wrap"}},
        React.createElement("span",{style:{fontSize:12,color:C.grayMid}},"전체 "+images.length+"장"),
        nonAll.filter(t=>images.some(i=>i.teacherId===t.id)).map(t=>
          React.createElement("span",{key:t.id,style:{fontSize:12,color:C.grayMid}},t.name+" "+images.filter(i=>i.teacherId===t.id).length+"장")
        )
      ),

      // 푸터
      React.createElement("div",{style:{marginTop:"2.5rem",paddingTop:"1.5rem",borderTop:"1px solid "+C.line,display:"flex",alignItems:"center",justifyContent:"space-between"}},
        React.createElement("img",{src:LOGO_B64,alt:"로고",style:{height:24,objectFit:"contain",opacity:0.4}}),
        React.createElement("span",{style:{fontSize:11,color:C.grayLight}},"FIRST BARISTA & BAKING · 제품 갤러리")
      )
    ),

    // 라이트박스
    lbImg&&React.createElement("div",{onClick:()=>setLightboxIdx(null),
      style:{position:"fixed",inset:0,background:"rgba(0,0,0,0.93)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:"1rem"}},
      lightboxIdx>0&&React.createElement("button",{onClick:e=>{e.stopPropagation();goLb(-1);},
        style:{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",width:44,height:44,
          background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.3)",
          color:"#fff",fontSize:24,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}},"‹"),
      lightboxIdx<filtered.length-1&&React.createElement("button",{onClick:e=>{e.stopPropagation();goLb(1);},
        style:{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",width:44,height:44,
          background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.3)",
          color:"#fff",fontSize:24,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}},"›"),
      React.createElement("div",{onClick:e=>e.stopPropagation(),style:{maxWidth:560,width:"100%",background:C.white,overflow:"hidden"}},
        React.createElement("div",{style:{height:3,background:"linear-gradient(to right,"+C.coral+","+C.gold+")"}}),
        React.createElement("img",{src:lbImg.data,alt:lbImg.name,style:{width:"100%",maxHeight:360,objectFit:"contain",display:"block",background:"#111"}}),
        React.createElement("div",{style:{padding:"14px 16px"}},
          React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}},
            React.createElement("div",null,
              React.createElement("p",{style:{fontSize:14,fontWeight:700,margin:"0 0 3px",color:C.black}},getTName(lbImg.teacherId)),
              React.createElement("p",{style:{fontSize:11,color:C.grayMid,margin:0}},lbImg.uploadedAt+" · "+(lightboxIdx+1)+"/"+filtered.length)
            ),
            React.createElement("div",{style:{display:"flex",gap:6,alignItems:"center"}},
              React.createElement("button",{onClick:e=>cycleStatus(lbImg.id,e),
                style:{fontSize:11,padding:"5px 10px",cursor:"pointer",fontWeight:700,borderRadius:3,
                  background:lbImg.useStatus==="used"?"#fff1ee":lbImg.useStatus==="pending"?"#fff8e8":C.bg,
                  border:"1.5px solid "+stMap[lbImg.useStatus||"unused"].color,
                  color:stMap[lbImg.useStatus||"unused"].color}},
                lbImg.useStatus==="used"?"✅ 사용완료":lbImg.useStatus==="pending"?"🔖 사용예정":"📷 미사용"),
              React.createElement("button",{onClick:e=>{e.stopPropagation();setDeleteConfirm(lbImg.id);},
                style:{fontSize:11,padding:"5px 10px",cursor:"pointer",background:"#fff1ee",
                  border:"1px solid #e88080",color:"#c0392b",borderRadius:3,fontWeight:600}},"🗑 삭제")
            )
          ),
          React.createElement("p",{style:{fontSize:11,color:C.grayMid,margin:"0 0 5px",fontWeight:600}},"📝 블로그 메모"),
          React.createElement("input",{defaultValue:lbImg.blogNote||"",
            placeholder:"예: 3월 크루아상 수업, 1번 포스팅 사용",
            onBlur:e=>saveBlogNote(lbImg.id,e.target.value),onClick:e=>e.stopPropagation(),
            style:{width:"100%",fontSize:12,padding:"7px 10px",border:"1px solid "+C.line,
              outline:"none",boxSizing:"border-box",marginBottom:12}}),
          React.createElement("div",{style:{display:"flex",gap:8}},
            React.createElement("button",{onClick:()=>dlSingle(lbImg),
              style:{flex:1,fontSize:13,padding:"9px",display:"flex",alignItems:"center",justifyContent:"center",gap:6,
                background:C.coral,color:"#fff",border:"none",cursor:"pointer",fontWeight:700}},"⬇ 다운로드"),
            React.createElement("button",{onClick:()=>setLightboxIdx(null),
              style:{fontSize:13,padding:"9px 16px",background:C.bg,color:C.gray,border:"1px solid "+C.line,cursor:"pointer"}},"✕")
          )
        )
      )
    )
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
